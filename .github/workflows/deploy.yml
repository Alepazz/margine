name: Deploy su GitHub Pages

# Ogni push su main ripubblica il sito. Nel repo viaggiano solo i dati cifrati,
# quindi la build non ha bisogno di nessun segreto — ed è per questo che le action
# stanno sul tag di major (@v7) e non su uno SHA: senza segreti da esfiltrare il
# rischio che il pinning copre non esiste, e le patch arrivano da sole.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; se ne parte un altro, quello in coda aspetta.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 è l'LTS attuale ed è quello su cui girano anche le action qui sotto.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Controlli
        run: |
          npm run test
          npx tsc --noEmit

      - run: npm run build

      - uses: actions/configure-pages@v6

      # Da v4 questa action esclude i file nascosti dall'artifact. `dist/` non ne ha
      # (Vite scrive index.html, assets/, data/, manifest e icone), quindi va bene così;
      # se un giorno servisse pubblicare un dotfile, l'input è `include-hidden-files`.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
